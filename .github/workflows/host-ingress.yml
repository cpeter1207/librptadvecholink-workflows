name: EchoLink host ingress compatibility
run-name: EchoLink ingress / ${{ inputs.controller_ref }} / ${{ inputs.ring_ref }}

on:
  workflow_call:
    inputs:
      code_ref:
        type: string
        required: true
      controller_ref:
        type: string
        required: true
      ring_ref:
        type: string
        required: true
      coverage:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      code_ref:
        description: Exact 40-character EchoLink provider candidate SHA
        type: string
        required: true
      controller_ref:
        description: Exact 40-character controller candidate SHA
        type: string
        required: true
      ring_ref:
        description: Exact 40-character shared ring candidate SHA
        type: string
        required: true
      coverage:
        description: Generate the first controller production coverage report
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.coverage && 60 || 25 }}
    steps:
      - name: Validate candidate revisions
        env:
          ECHO_REF: ${{ inputs.code_ref }}
          CONTROLLER_REF: ${{ inputs.controller_ref }}
          RING_REF: ${{ inputs.ring_ref }}
        run: |
          [[ "$ECHO_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROLLER_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RING_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced
          ref: ${{ inputs.controller_ref }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/librptadvecholink
          ref: ${{ inputs.code_ref }}
          path: .test-echo
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rate_adjusting_pcm_ring
          ref: ${{ inputs.ring_ref }}
          path: .test-ring
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced-workflows
          path: .quality-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/librptadvdtmf
          ref: 6ffd7d25e3d4880234e0eff4d33d943be7465bf5
          path: .test-dtmf
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/librptadviax2
          ref: 3e77301944fd99e7a8e49ad63f6a488c98064e7f
          path: .test-iax
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/usbradioplus
          ref: ca8e9724cdfb9da771c3cad8da8a87cd36d405b8
          path: .test-usb
          persist-credentials: false
      - name: Verify installed candidate DSO in the native quality image
        env:
          QUALITY_IMAGE: ghcr.io/cpeter1207/rptadv-echolink-quality-debian13:latest
          HOST_COVERAGE: ${{ inputs.coverage }}
        shell: bash
        run: |
          set -euo pipefail
          host_memory=4g
          if [ "$HOST_COVERAGE" = true ]; then host_memory=8g; fi
          docker() {
            if [ "$1" = run ]; then
              shift
              command docker run --cpus=2 --memory="$host_memory" --memory-swap="$host_memory" --pids-limit=256 "$@"
            else
              command docker "$@"
            fi
          }
          # The quoted script expands workspace paths inside the container.
          # shellcheck disable=SC2016
          . .quality-tools/tools/run-in-quality-container.sh \
            "$QUALITY_IMAGE" "$GITHUB_WORKSPACE" sh -ec '
              test "$(dpkg --print-architecture)" = amd64
              . /etc/os-release
              test "$VERSION_ID" = 13
              export CARGO_BUILD_JOBS=2
              # Product tests compile standalone bindings too. Use its current
              # source contracts only in this disposable container; runtime
              # qualification still requires the released dependency gate.
              install -m 644 .test-iax/include/rptadv_iax2_client.h /usr/include/rptadv_iax2/
              install -m 644 .test-usb/rust/product/include/usbradioplus_product.h /usr/include/
              export CARGO_TARGET_DIR=/tmp/echolink-ring-target
              ring_source=$(mktemp -d /tmp/echolink-ring-source.XXXXXX)
              cp -a .test-ring/. "$ring_source/"
              make -C "$ring_source" all install CARGO="cargo +1.85.0" \
                PREFIX="$PWD/.test-sdk" LIBDIR="$PWD/.test-sdk/lib"
              export CARGO_TARGET_DIR=/tmp/echolink-dtmf-target
              dtmf_source=$(mktemp -d /tmp/echolink-dtmf-source.XXXXXX)
              cp -a .test-dtmf/. "$dtmf_source/"
              make -C "$dtmf_source" all install CARGO="cargo +1.85.0" \
                PREFIX="$PWD/.test-sdk" LIBDIR="$PWD/.test-sdk/lib"
              # Exercise the actual complete provider table, not only mock
              # host fixtures. The account tests use loopback identities only.
              export CARGO_TARGET_DIR=/tmp/echolink-provider-target
              echo_source=$(mktemp -d /tmp/echolink-provider-source.XXXXXX)
              cp -a .test-echo/. "$echo_source/"
              make -C "$echo_source" all install CARGO="cargo +1.85.0" \
                PREFIX="$PWD/.test-sdk" LIBDIR="$PWD/.test-sdk/lib"
              export CARGO_TARGET_DIR=/tmp/echolink-host-target
              export URP_PRODUCT_INCLUDE="$PWD/.test-sdk/include"
              export RUSTFLAGS="${RUSTFLAGS:-} -L native=$PWD/.test-sdk/lib"
              export LD_LIBRARY_PATH="$PWD/.test-sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              cargo +1.85.0 test --locked -p rptadv-peer-support
              cargo +1.85.0 clippy --locked -p rptadv-peer-support --all-targets -- -D warnings
              RUSTDOCFLAGS="-D warnings" cargo +1.85.0 doc --locked -p rptadv-peer-support --no-deps
              # Host loader tests require the complete candidate private set;
              # the dependency image does not supply that runtime installation.
              export RPT_ADVANCED_LIBDIR="$PWD/build"
              if [ "$1" = true ]; then
                # Reuse the production coverage recipe with the matched private
                # provider set. This is a diagnostic report, not a PR gate.
                make rust-coverage CARGO=cargo
                exit 0
              fi
              make rust-build CARGO="cargo +1.85.0"
              export LD_LIBRARY_PATH="$PWD/build:$LD_LIBRARY_PATH"
              readelf -d "$RPT_ADVANCED_LIBDIR/librptadv_product.so.2" | grep "SONAME.*librptadv_product.so.2"
              cargo +1.85.0 fmt --all -- --check
              cargo +1.85.0 clippy --locked -p rptadv-product --all-targets -- -D warnings
              RUSTDOCFLAGS="-D warnings" cargo +1.85.0 doc --locked -p rptadv-product --no-deps
              cargo +1.85.0 test --locked -p rptadv-product --lib link::ring::tests
              cargo +1.85.0 test --locked -p rptadv-product --lib services::tests
              cargo +1.85.0 test --locked -p rptadv-product --test echo_text
              cargo +1.85.0 test --locked -p rptadv-product --test peer_observation
              cargo +1.85.0 test --locked -p rptadv-product --lib link::text::tests
              cargo +1.85.0 test --locked -p rptadv-product --lib configuration::tests
              cargo +1.85.0 test --locked -p rptadv-product --lib control::tests
              cargo +1.85.0 test --locked -p rptadv-product --lib link::session::tests::echo_source -- --test-threads=1
              # The 2000-peer memory stress is a separate platform/load gate,
              # not part of this bounded four-GiB host regression job.
              cargo +1.85.0 test --locked -p rptadv-product --lib link::session::tests -- --test-threads=1 --skip egress_admission_above_1024
              cargo +1.85.0 test --locked -p rptadv-product --lib host::tests::echo_ring_policy_survives_prepared_generation
              cargo +1.85.0 test --locked -p rptadv-product --lib host::tests::echo_account_status_is_visible_without_active_links
              cargo +1.85.0 test --locked -p rptadv-product --lib host::tests::echo_alias_routing_precedes_allstar_directory_lookup
              cargo +1.85.0 test --locked -p rptadv-product --lib host::tests::incoming_echo_uses_its_validated_qso_and_protocol_qualified_link_key
              cargo +1.85.0 test --locked -p rptadv-product --lib lifecycle::tests
              cargo +1.85.0 test --locked -p rpt-advanced-standalone --lib host_services::
              cargo +1.85.0 test --locked -p rpt-advanced-standalone --lib runtime::tests
              cargo +1.85.0 test --locked -p rptadv-asterisk-adapter --lib services::
              cargo +1.85.0 test --locked -p rptadv-asterisk-adapter --lib application::tests
              cargo +1.85.0 test --locked -p rptadv-asterisk-adapter --lib lifecycle::tests
              cargo +1.85.0 test --locked -p rpt-advanced-core --test link
              cargo +1.85.0 test --locked -p rpt-advanced-core --test echo_identity
              cargo +1.85.0 test --locked -p rpt-advanced-core --lib runtime::aggregate::tests::loop_rejection_queues_localized_rf_speech_to_the_local_transmitter
              # Same-PID Asterisk activation uses only the synthetic radio and
              # loopback Proxy; never use a configured device or public account.
              asterisk -V
              make -o rust-build build/app_rpt_advanced.so build/chan_rpt_fixture.so
              fixture_modules=$(mktemp -d /tmp/echolink-host-modules.XXXXXX)
              install -m 0755 build/app_rpt_advanced.so build/chan_rpt_fixture.so "$fixture_modules/"
              RPT_TEST_MODULE_DIR="$fixture_modules" python3 tests/test_rust_asterisk_lifecycle.py
            ' sh "$HOST_COVERAGE"
      - uses: actions/upload-artifact@v7
        if: always() && inputs.coverage
        with:
          name: controller-production-coverage
          path: build/coverage/rust.json
          if-no-files-found: error
