name: Publish EchoLink quality image
on:
  workflow_dispatch:
    inputs:
      jitter_version:
        description: Released signed-APT jitter package version
        type: string
        default: 0.1.0~alpha17-1
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: echolink-quality-image-publication
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Fetch released native jitter capability
        env:
          JITTER_VERSION: ${{ inputs.jitter_version }}
        run: bash tools/download-jitter-packages.sh dependencies "$JITTER_VERSION"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/quality.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-contexts: dependencies=dependencies
          load: true
          tags: ghcr.io/cpeter1207/rptadv-echolink-quality-debian13:${{ github.sha }}-${{ matrix.arch }}
      - name: Verify providers and publish native image
        env:
          IMAGE: ghcr.io/cpeter1207/rptadv-echolink-quality-debian13:${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=4g --pids-limit=256 --label rptadv.echolink-test=true -e ARCH "$IMAGE" sh -ec '
            test "$(dpkg --print-architecture)" = "$ARCH"
            test -f /usr/include/rptadv-codec/rptadv_codec.h
            library=/usr/lib/$(gcc -print-multiarch)
            test -f "$library/librptadv_codec_gsm.so.1"
            test -f "$library/librptadv_codec_speex.so.1"
            test -f "$library/rpt_advanced/librptadv_jitter_adapter.so.1"
            ldd "$library/librptadv_codec_gsm.so.1" > /tmp/provider-links
            ldd "$library/librptadv_codec_speex.so.1" >> /tmp/provider-links
            ldd "$library/rpt_advanced/librptadv_jitter_adapter.so.1" >> /tmp/provider-links
            ! grep -F "not found" /tmp/provider-links
          '
          docker push "$IMAGE"
      - name: Remove project-owned test containers
        if: always()
        run: docker ps -aq --filter label=rptadv.echolink-test=true | xargs -r docker rm -f
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture manifest
        env:
          IMAGE: ghcr.io/cpeter1207/rptadv-echolink-quality-debian13
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
